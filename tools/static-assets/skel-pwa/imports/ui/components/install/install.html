<template name="installBanner">
  {{#if isInstalled}}
    <p style="color:#1a6b1a;font-weight:600;">&#10003; Running as an installed PWA.</p>
  {{else if canInstall}}
    <div style="border:2px solid #ff6b35;border-radius:8px;padding:10px 14px;background:#fff5f0;margin:10px 0;">
      <p style="margin:0 0 8px;">Install this app on your device.</p>
      <button class="install-btn" type="button">Install</button>
      <button class="dismiss-btn" type="button">Not now</button>
    </div>
  {{/if}}
</template>
